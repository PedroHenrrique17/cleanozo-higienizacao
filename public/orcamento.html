<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>Clean Ozo - Orçamento</title>
</head>

<body>
  <header class="contentHeader">
    <img class="logo" src="./img/logo.png" alt="">

    <nav class="navegation">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="resultados.html">Resultados</a></li>
      </ul>

    </nav>
  </header>

  <section class="orcamento">
    <div class="container">
      <span class="subtitulo">SOLICITE SEU ORÇAMENTO</span>
      <h2>Solicite seu orçamento</h2>
      <p>
        Preencha os dados abaixo e receba um orçamento sem compromisso.
      </p>

      <form class="form-orcamento">
        <input type="text" placeholder="Nome completo">

        <input type="email" placeholder="E-mail">

        <input type="tel" placeholder="Telefone">

        <select>
          <option value="">
            Selecione um serviço
          </option>
          <option>Limpeza de Estofados</option>
          <option>Limpeza de Carpetes</option>
          <option>Limpeza de Tapetes</option>
          <option>Higienização de Colchões</option>
          <option>Higienização de Capacetes</option>
        </select>

        <textarea rows="5" placeholder="Mensagem (opcional)"></textarea>

        <button type="submit">
          Enviar Solicitação
        </button>

      </form>

    </div>
  </section>
</body>

</html>
